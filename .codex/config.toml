#web_search = "disabled"
approval_policy = "on-request"
sandbox_mode = "workspace-write"

[agents]
max_threads = 4
max_depth = 1
job_max_runtime_seconds = 1800

[agents.planner]
description = "Plans project changes and writes the V2 run plan artifact."
config_file = "agents/planner.toml"

[agents.implementer]
description = "Implements the approved V2 plan with minimal safe changes."
config_file = "agents/implementer.toml"

[agents.tester]
description = "Runs focused checks and writes the V2 test-results artifact."
config_file = "agents/tester.toml"

[agents.reviewer]
description = "Reviews the diff, test results, conventions, and approval state."
config_file = "agents/reviewer.toml"

[apps._default]
enabled = false
default_tools_enabled = false
open_world_enabled = false
destructive_enabled = false

